# Render Blueprint for the Latte API.
# Database is external (Neon free Postgres), so there is no `databases:` block —
# DATABASE_URL is pasted into the Render dashboard as a secret.
#
# In Render: New > Blueprint, point at this repo, then fill in the three
# `sync: false` env vars (DATABASE_URL, GOOGLE_CLIENT_ID, CORS_ORIGINS).

services:
  - type: web
    name: latte-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: DATABASE_URL
        sync: false                  # Neon pooled connection string
      - key: GOOGLE_CLIENT_ID
        sync: false                  # same client ID the frontend uses
      - key: CORS_ORIGINS
        sync: false                  # e.g. https://your-app.vercel.app
